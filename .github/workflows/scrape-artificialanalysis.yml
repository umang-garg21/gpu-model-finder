name: Scrape ArtificialAnalysis Intelligence

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Chrome for Puppeteer
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 'stable'

      - name: Install dependencies
        run: npm ci

      - name: Run intelligence scraper
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome_path || '/usr/bin/google-chrome-stable' }}
        run: npm run fetch:intel

      - name: Merge intel into models
        run: npm run merge:intel

      - name: Commit and push updated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models_artificialanalysis.json data/artificialanalysis_intel_metrics.json || true
          git commit -m "chore: update ArtificialAnalysis intelligence metrics (automated)" || echo "no changes to commit"
          git push origin HEAD:${{ github.ref_name }} || true
